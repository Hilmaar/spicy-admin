[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"config/settings/test.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E501"]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 110

[tool.coverage.run]
omit = ["*/tests.py", "*/migrations/*"]
